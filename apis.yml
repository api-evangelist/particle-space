description: Particle Space is proptech infrastructure that exposes real-estate and
  property data through a REST API, Dashboard, SDKs, and white-labeled UIs. The
  platform provides real-time access to millions of properties for sale, rent, and
  off-market - property records, address and property search, valuations, comparables,
  and listings - using publishable and secret API keys with live and test modes.
