publisherName: Particle Space
serviceCategory: Real Estate and Property Data
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Particle Space
  ServiceCategory: Real Estate and Property Data
