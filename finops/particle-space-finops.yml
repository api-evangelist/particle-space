description: >-
  FinOps view of Particle Space spend. Particle Space bills on a tiered
  subscription model metered by API requests, with a free Developer tier and
  paid tiers that raise monthly request volumes. Exact paid-tier prices and
  quotas are not reconciled here and should be verified on the pricing page.
notes: >-
  Tier prices and request quotas are subject to change; verify against
  https://particlespace.com/pricing/ during reconciliation.
sources:
- https://particlespace.com/pricing/
- https://docs.particlespace.com/docs/intro/
- https://focus.finops.org/focus-specification/v1-3/
