meters:
- name: api_requests
  description: API requests made against the Particle Space platform, metered per plan per month.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
  - mode
- name: subscription_fee
  description: Recurring monthly subscription fee for the selected plan tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track monthly API request consumption per key and mode (live vs. test) against the plan quota.
- name: Allocation
  description: Tag publishable/secret keys per product or team and map usage to internal cost centers.
- name: Optimization
  description: Use test mode for development to avoid consuming live quota; cache stable property records and valuations to reduce repeat calls; right-size the plan tier to monthly volume.
- name: Accountability
  description: Assign owners per integration; review request burn monthly against the plan quota and budget.
